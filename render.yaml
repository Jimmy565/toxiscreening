services:
  - type: web
    name: toxiscreen-hub
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DB_PATH
        value: /var/data/toxicity_app.db
    disk:
      name: toxicity-data
      mountPath: /var/data
      sizeGB: 1